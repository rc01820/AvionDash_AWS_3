AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AvionPulse v3 — core stack (plain CloudFormation). Serverless and always on:
  CloudFront + S3 / API Gateway HTTP API + Lambda / DynamoDB (+ Streams) + SQS (KMS) /
  EventBridge bus + SNS + Step Functions Express + SSM flags, plus the roles and FIS
  templates that let the Chaos page launch the on-demand Classic tier (EC2 / ALB / RDS)
  as a second stack. Keep the stack name at 24 characters or fewer.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: '1. Code package (required)'}
        Parameters: [CodeBucket, CodeKey]
      - Label: {default: '2. Application'}
        Parameters: [AppEnv, AppVersion, AdminPassword, SeedVersion]
      - Label: {default: '3. Datadog (optional)'}
        Parameters: [EnableDatadog, DatadogSite, DatadogApiKeySsmName, DatadogPythonLayerVersion,
                     DatadogExtensionLayerVersion, RumApplicationId, RumClientToken]
      - Label: {default: '4. Cost guards'}
        Parameters: [ApiRateLimit, ApiBurstLimit, FaultTtlMinutes, LogRetentionDays, SimulatorSchedule,
                     BudgetEmail, MonthlyBudgetUsd]
    ParameterLabels:
      CodeBucket: {default: S3 bucket holding the code zip}
      CodeKey: {default: Object key of the code zip}
      AdminPassword: {default: Admin password (blank = demo password aviondash123)}

Parameters:
  CodeBucket:
    Type: String
    MinLength: 3
    Description: Name of an S3 bucket in THIS region that holds the zip built by scripts/package.py.
  CodeKey:
    Type: String
    Default: avionpulse/avionpulse-code.zip
    Description: Key of the code zip. Use a new key (package.py adds a content hash) to roll out code changes.
  AppEnv:
    Type: String
    Default: demo
    AllowedPattern: '[a-z0-9-]{1,20}'
    Description: Value of the env tag (Datadog DD_ENV).
  AppVersion:
    Type: String
    Default: 3.0.0
  AdminPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: Optional. Replaces the published demo password for the admin user (chaos + Classic tier launch). Strongly recommended — admin can start paid EC2/RDS resources.
  SeedVersion:
    Type: String
    Default: '1'
    Description: Change this value to reseed the table on the next stack update.
  EnableDatadog:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
    Description: Attach the Datadog Python library + Extension layers (and install the Agent on Classic-tier EC2). Requires the SSM parameter below to exist.
  DatadogSite:
    Type: String
    Default: datadoghq.com
    AllowedValues: [datadoghq.com, us3.datadoghq.com, us5.datadoghq.com, datadoghq.eu, ap1.datadoghq.com, ap2.datadoghq.com, ddog-gov.com]
  DatadogApiKeySsmName:
    Type: String
    Default: /avionpulse/datadog/api-key
    Description: SSM SecureString holding the Datadog API key (create it before enabling Datadog).
  DatadogPythonLayerVersion:
    Type: Number
    Default: 107
    Description: Version of layer Datadog-Python312-ARM (account 464622532012). Check Datadog docs for the latest.
  DatadogExtensionLayerVersion:
    Type: Number
    Default: 80
    Description: Version of layer Datadog-Extension-ARM (account 464622532012). Check Datadog docs for the latest.
  RumApplicationId:
    Type: String
    Default: ''
    Description: Optional Datadog RUM application id.
  RumClientToken:
    Type: String
    Default: ''
    Description: Optional Datadog RUM client token (public, starts with pub).
  ApiRateLimit:
    Type: Number
    Default: 20
    Description: Steady-state req/s ceiling on the HTTP API (restored after the api_throttling fault).
  ApiBurstLimit:
    Type: Number
    Default: 40
  FaultTtlMinutes:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 120
    Description: Default minutes before an injected fault auto-reverts.
  LogRetentionDays:
    Type: Number
    Default: 3
    AllowedValues: [1, 3, 5, 7, 14]
  SimulatorSchedule:
    Type: String
    Default: rate(5 minutes)
  BudgetEmail:
    Type: String
    Default: ''
    Description: Optional. If set, creates a monthly AWS Budget that emails this address. Recommended if you use the Classic tier.
  MonthlyBudgetUsd:
    Type: Number
    Default: 10

Conditions:
  UseDatadog: !Equals [!Ref EnableDatadog, 'true']
  CreateBudget: !Not [!Equals [!Ref BudgetEmail, '']]

Resources:
  # ════════════════════════════ DATA TIER ════════════════════════════════
  Table:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: !Sub ${AWS::StackName}-data
      BillingMode: PROVISIONED
      ProvisionedThroughput: {ReadCapacityUnits: 5, WriteCapacityUnits: 5}
      AttributeDefinitions:
        - {AttributeName: PK, AttributeType: S}
        - {AttributeName: SK, AttributeType: S}
      KeySchema:
        - {AttributeName: PK, KeyType: HASH}
        - {AttributeName: SK, KeyType: RANGE}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}
      StreamSpecification: {StreamViewType: KEYS_ONLY}
      Tags:
        - {Key: app, Value: avionpulse}

  # Customer-managed key for the events queue (kms_key_disabled). ~$1/month.
  EventsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Description: AvionPulse events queue encryption (chaos target for kms_key_disabled)
      EnableKeyRotation: true
      PendingWindowInDays: 7
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: kms:*
            Resource: '*'
      Tags:
        - {Key: app, Value: avionpulse}
  EventsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-events
      TargetKeyId: !Ref EventsKey

  EventsDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-events-dlq
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true
      Tags:
        - {Key: app, Value: avionpulse}

  EventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${AWS::StackName}-events
      VisibilityTimeout: 60
      MessageRetentionPeriod: 86400
      KmsMasterKeyId: !Ref EventsKey
      KmsDataKeyReusePeriodSeconds: 60
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt EventsDLQ.Arn
        maxReceiveCount: 3
      Tags:
        - {Key: app, Value: avionpulse}

  FlagsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${AWS::StackName}/config/flags
      Type: String
      Description: AvionPulse feature flags (chaos target for ssm_config_poisoned)
      Value: '{"board_page_size": 100, "weather_enabled": true, "maintenance_intake": true}'
      Tags: {app: avionpulse}

  # Flight-data recorder: simulator snapshots, expire after a day.
  RecorderBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - {Id: expire-snapshots, Status: Enabled, ExpirationInDays: 1}
      NotificationConfiguration:
        EventBridgeConfiguration: {EventBridgeEnabled: true}
      Tags:
        - {Key: app, Value: avionpulse}

  # ════════════════════════════ WEB TIER ═════════════════════════════════
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      Tags:
        - {Key: app, Value: avionpulse}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub AvionPulse (${AWS::StackName})
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ''}
          - Id: api
            DomainName: !Sub ${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # Managed-CachingOptimized
        CacheBehaviors:
          # Public status page: rendered by the api function, never cached.
          - PathPattern: /status
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader
      Tags:
        - {Key: app, Value: avionpulse}

  # ════════════════════════════ IAM ══════════════════════════════════════
  # Names below are built with !Sub rather than !GetAtt so the policies don't
  # depend on the resources whose targets are the functions that use this role
  # (that would be a circular dependency).
  ChaosInfraPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: AvionPulse runtime + serverless chaos control-plane permissions
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ApiGatewayStageAndIntegration
            Effect: Allow
            Action: [apigateway:GET, apigateway:PATCH]
            Resource:
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApi}/stages/*
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/${HttpApi}/integrations/*
          - Sid: RecycleApiFunction
            Effect: Allow
            Action: [lambda:GetFunctionConfiguration, lambda:UpdateFunctionConfiguration]
            Resource:
              - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-api
              - !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-worker
          - Sid: WorkerConcurrency
            Effect: Allow
            Action: [lambda:PutFunctionConcurrency, lambda:DeleteFunctionConcurrency, lambda:GetFunctionConcurrency]
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-worker
          - Sid: ProcessorResourcePolicy
            Effect: Allow
            Action: [lambda:GetPolicy, lambda:AddPermission, lambda:RemovePermission]
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-processor
          - Sid: ListMappings
            Effect: Allow
            Action: lambda:ListEventSourceMappings
            Resource: '*'
          - Sid: ToggleMappings
            Effect: Allow
            Action: [lambda:UpdateEventSourceMapping, lambda:GetEventSourceMapping]
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:event-source-mapping:*
          - Sid: Queues
            Effect: Allow
            Action: [sqs:SendMessage, sqs:GetQueueAttributes, sqs:SetQueueAttributes]
            Resource: [!GetAtt EventsQueue.Arn, !GetAtt EventsDLQ.Arn]
          - Sid: QueueKey
            Effect: Allow
            Action: [kms:GenerateDataKey, kms:Decrypt, kms:DescribeKey, kms:DisableKey, kms:EnableKey]
            Resource: !GetAtt EventsKey.Arn
          - Sid: TableCapacity
            Effect: Allow
            Action: dynamodb:UpdateTable
            Resource: !GetAtt Table.Arn
          - Sid: SimulatorRule
            Effect: Allow
            Action: [events:EnableRule, events:DisableRule, events:DescribeRule]
            Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-simulator-tick
          - Sid: FlightOpsBus
            Effect: Allow
            Action: events:PutEvents
            Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${AWS::StackName}-flight-ops
          - Sid: FlightStatusRuleTargets
            Effect: Allow
            Action: [events:PutTargets, events:ListTargetsByRule]
            Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${AWS::StackName}-flight-ops/${AWS::StackName}-flight-status
          - Sid: CrewAlerts
            Effect: Allow
            Action: sns:Publish
            Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}-crew-alerts
          - Sid: Turnaround
            Effect: Allow
            Action: states:StartExecution
            Resource: !Sub arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${AWS::StackName}-turnaround
          - Sid: FeatureFlags
            Effect: Allow
            Action: [ssm:GetParameter, ssm:PutParameter]
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/config/flags
          - Sid: RecorderBucket
            Effect: Allow
            Action: [s3:PutObject, s3:GetBucketPolicy, s3:PutBucketPolicy, s3:DeleteBucketPolicy]
            Resource: [!GetAtt RecorderBucket.Arn, !Sub '${RecorderBucket.Arn}/*']
          - Sid: WorkerPolicyAttachment
            Effect: Allow
            Action: [iam:AttachRolePolicy, iam:DetachRolePolicy]
            Resource: !GetAtt WorkerRole.Arn
            Condition:
              ArnEquals: {iam:PolicyARN: !Ref WorkerDataPolicy}
          - Sid: WorkerPolicyRead
            Effect: Allow
            Action: iam:ListAttachedRolePolicies
            Resource: !GetAtt WorkerRole.Arn
          - Sid: NotamObjects
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/data/*
          - Sid: ListBucketSoMissingKeysAre404
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
          - Sid: DatadogApiKey
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatadogApiKeySsmName}
          - Sid: DecryptSsmDefaultKey
            Effect: Allow
            Action: kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
          # Intentionally NO permission on <stack>-data-restricted-ledger:
          # the iam_access_denied fault depends on that gap.

  # Launch / tear down / break the Classic stack. Every write is limited to
  # resources tagged avionpulse:classic=<this stack> or named <stack>-classic.
  ClassicControlPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: AvionPulse Classic tier lifecycle + chaos permissions
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ClassicStack
            Effect: Allow
            Action: [cloudformation:CreateStack, cloudformation:DeleteStack, cloudformation:DescribeStacks,
                     cloudformation:DescribeStackEvents, cloudformation:TagResource]
            Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-classic/*
          - Sid: PassClassicRoles
            Effect: Allow
            Action: iam:PassRole
            Resource: [!GetAtt ClassicCfnRole.Arn, !GetAtt ClassicSchedulerRole.Arn]
          - Sid: AutoShutdownSchedule
            Effect: Allow
            Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule, scheduler:GetSchedule]
            Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/${AWS::StackName}-classic-expiry
          - Sid: Describe
            Effect: Allow
            Action: [ec2:DescribeSecurityGroups, ec2:DescribeNetworkAcls, autoscaling:DescribeAutoScalingGroups,
                     elasticloadbalancing:DescribeRules, rds:DescribeDBInstances, fis:GetExperiment]
            Resource: '*'
          - Sid: NetworkFaults
            Effect: Allow
            Action: [ec2:RevokeSecurityGroupIngress, ec2:AuthorizeSecurityGroupIngress,
                     ec2:CreateNetworkAclEntry, ec2:DeleteNetworkAclEntry]
            Resource: '*'
            Condition:
              StringEquals: {'aws:ResourceTag/avionpulse:classic': !Ref AWS::StackName}
          - Sid: ScaleFaults
            Effect: Allow
            Action: autoscaling:UpdateAutoScalingGroup
            Resource: '*'
            Condition:
              StringEquals: {'autoscaling:ResourceTag/avionpulse:classic': !Ref AWS::StackName}
          - Sid: AlbRuleFault
            Effect: Allow
            Action: elasticloadbalancing:ModifyRule
            Resource: !Sub arn:${AWS::Partition}:elasticloadbalancing:${AWS::Region}:${AWS::AccountId}:listener-rule/app/${AWS::StackName}-classic/*
          - Sid: RdsReboot
            Effect: Allow
            Action: rds:RebootDBInstance
            Resource: '*'
            Condition:
              StringEquals: {'aws:ResourceTag/avionpulse:classic': !Ref AWS::StackName}
          - Sid: FisExperiments
            Effect: Allow
            Action: [fis:StartExperiment, fis:StopExperiment, fis:TagResource]
            Resource:
              - !Sub arn:${AWS::Partition}:fis:${AWS::Region}:${AWS::AccountId}:experiment-template/*
              - !Sub arn:${AWS::Partition}:fis:${AWS::Region}:${AWS::AccountId}:experiment/*

  AppRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AvionPulse api / simulator / janitor / processor / seed functions
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref ChaosInfraPolicy
        - !Ref ClassicControlPolicy
      Policies:
        - PolicyName: data-tier
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Table
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DeleteItem,
                         dynamodb:Query, dynamodb:Scan, dynamodb:BatchGetItem, dynamodb:BatchWriteItem,
                         dynamodb:DescribeTable, dynamodb:ConditionCheckItem]
                Resource: !GetAtt Table.Arn
              - Sid: TableStream
                Effect: Allow
                Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:ListStreams]
                Resource: !Sub ${Table.Arn}/stream/*
      Tags:
        - {Key: app, Value: avionpulse}

  # The worker has its own role so iam_policy_detached can pull its data access
  # without touching the API. Polling SQS stays in the inline policy, so the
  # trigger keeps running and the failure shows up as AccessDenied on writes.
  WorkerDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: AvionPulse worker data access (chaos target for iam_policy_detached)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [dynamodb:PutItem, dynamodb:GetItem, dynamodb:Query, dynamodb:UpdateItem]
            Resource: !GetAtt Table.Arn

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AvionPulse SQS worker
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref WorkerDataPolicy
      Policies:
        - PolicyName: worker-base
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WorkerTrigger
                Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:ChangeMessageVisibility, sqs:GetQueueAttributes]
                Resource: !GetAtt EventsQueue.Arn
              - Sid: QueueKey
                Effect: Allow
                Action: kms:Decrypt
                Resource: !GetAtt EventsKey.Arn
              - Sid: DatadogApiKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatadogApiKeySsmName}
              - Sid: DecryptSsmDefaultKey
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
      Tags:
        - {Key: app, Value: avionpulse}

  SiteDeployerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AvionPulse site deployer (copies web files, invalidates CloudFront, empties buckets on delete)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: publish-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: [!Sub '${SiteBucket.Arn}/*', !Sub '${RecorderBucket.Arn}/*']
              - Effect: Allow
                Action: [s3:ListBucket, s3:DeleteBucketPolicy]
                Resource: [!GetAtt SiteBucket.Arn, !GetAtt RecorderBucket.Arn]
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
      Tags:
        - {Key: app, Value: avionpulse}

  StatesRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AvionPulse turnaround workflow
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: states.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-processor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-processor
      Tags:
        - {Key: app, Value: avionpulse}

  # ════════════════════════════ APP TIER ═════════════════════════════════
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: !Ref LogRetentionDays
  WorkerFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-worker
      RetentionInDays: !Ref LogRetentionDays
  SimulatorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-simulator
      RetentionInDays: !Ref LogRetentionDays
  JanitorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-janitor
      RetentionInDays: !Ref LogRetentionDays
  ProcessorFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-processor
      RetentionInDays: !Ref LogRetentionDays
  SeedLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-seed
      RetentionInDays: !Ref LogRetentionDays
  SiteDeployerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-site-deployer
      RetentionInDays: !Ref LogRetentionDays
  ApiAccessLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}-access
      RetentionInDays: !Ref LogRetentionDays

  ApiFunction:
