  WorkerTrigger:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt EventsQueue.Arn
      FunctionName: !Ref WorkerFunction
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 5
      FunctionResponseTypes: [ReportBatchItemFailures]
      Enabled: true

  SimulatorRetries:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref SimulatorFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 1

  SimulatorTick:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-simulator-tick
      Description: AvionPulse simulator tick (chaos target for eventbridge_rule_disabled)
      ScheduleExpression: !Ref SimulatorSchedule
      State: ENABLED
      Targets:
        - Id: simulator
          Arn: !GetAtt SimulatorFunction.Arn

  SimulatorTickPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SimulatorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SimulatorTick.Arn

  # Separate schedule so disabling the simulator's rule can't stop cleanup.
  JanitorTick:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-janitor-tick
      Description: AvionPulse janitor (fault TTLs + Classic tier auto-shutdown backstop). No chaos fault touches this rule.
      ScheduleExpression: rate(2 minutes)
      State: ENABLED
      Targets:
        - Id: janitor
          Arn: !GetAtt JanitorFunction.Arn

  JanitorTickPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref JanitorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt JanitorTick.Arn

  # ════════════════════════════ INTEGRATION TIER ═════════════════════════
  # DynamoDB Streams → processor. Only FLIGHT items pass the filter, so the
  # processor's own INTEG writes don't loop back.
  StreamMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt Table.StreamArn
      FunctionName: !Ref ProcessorFunction
      StartingPosition: LATEST
      BatchSize: 25
      MaximumBatchingWindowInSeconds: 10
      MaximumRetryAttempts: 10000
      MaximumRecordAgeInSeconds: 3600
      FilterCriteria:
        Filters:
          - Pattern: '{"dynamodb": {"Keys": {"PK": {"S": ["FLIGHT"]}}}}'

  FlightOpsBus:
    Type: AWS::Events::EventBus
    Properties:
      Name: !Sub ${AWS::StackName}-flight-ops

  FlightStatusRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-flight-status
      Description: FlightStatusChanged → processor (chaos target for eb_target_broken)
      EventBusName: !Ref FlightOpsBus
      EventPattern:
        detail-type: [FlightStatusChanged]
      State: ENABLED
      Targets:
        - Id: processor
          Arn: !GetAtt ProcessorFunction.Arn
          RetryPolicy: {MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 300}

  FlightStatusPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FlightStatusRule.Arn

  RecorderRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-recorder-object-created
      Description: Flight-data recorder uploads → processor
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket:
            name: [!Ref RecorderBucket]
      State: ENABLED
      Targets:
        - Id: processor
          Arn: !GetAtt ProcessorFunction.Arn

  RecorderPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessorFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RecorderRule.Arn

  CrewAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub ${AWS::StackName}-crew-alerts
      DisplayName: AvionPulse crew alerts
      Tags:
        - {Key: app, Value: avionpulse}

  CrewAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref CrewAlertsTopic
      Protocol: lambda
      Endpoint: !GetAtt ProcessorFunction.Arn

  # sns_delivery_failure removes this statement and puts it back.
  CrewAlertsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessorFunction
      Principal: sns.amazonaws.com
      SourceArn: !Ref CrewAlertsTopic

  TurnaroundStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ${AWS::StackName}-turnaround
      StateMachineType: EXPRESS
      RoleArn: !GetAtt StatesRole.Arn
      DefinitionString: !Sub
        - |-
          {
            "Comment": "AvionPulse aircraft turnaround",
            "StartAt": "AssignGate",
            "States": {
              "AssignGate": {"Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${Fn}", "Payload": {"task": "assign_gate", "flight.$": "$.flight",
                  "tail_number.$": "$.tail_number", "origin.$": "$.origin"}},
                "OutputPath": "$.Payload", "TimeoutSeconds": 5, "Next": "Refuel"},
              "Refuel": {"Type": "Pass", "Result": "fuel uplift complete", "ResultPath": "$.fuel", "Next": "CrewCheck"},
              "CrewCheck": {"Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${Fn}", "Payload": {"task": "crew_check", "flight.$": "$.flight",
                  "gate.$": "$.gate", "tail_number.$": "$.tail_number"}},
                "OutputPath": "$.Payload", "TimeoutSeconds": 5, "Next": "Boarding"},
              "Boarding": {"Type": "Pass", "Result": "boarding", "ResultPath": "$.phase", "Next": "Complete"},
              "Complete": {"Type": "Task", "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
                "Parameters": {"FunctionName": "${Fn}", "Payload": {"task": "complete", "flight.$": "$.flight",
                  "gate.$": "$.gate"}},
                "OutputPath": "$.Payload", "TimeoutSeconds": 5, "End": true}
            }
          }
        - Fn: !GetAtt ProcessorFunction.Arn
      Tags:
        - {Key: app, Value: avionpulse}

  # ── API Gateway HTTP API ───────────────────────────────────────────────
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub ${AWS::StackName}-http
      Description: AvionPulse API (reached via CloudFront /api/*)
      ProtocolType: HTTP
      Tags: {app: avionpulse}

  # Data routes. api_integration_broken repoints this one at a missing alias.
  # The URI is built with !Sub (not !GetAtt) so the api function can carry
  # this integration's id in its environment without a circular dependency.
  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-api
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  # Control routes (login, chaos, Classic launcher, drift) — never broken by a fault.
  ControlIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 30000

  ApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/{proxy+}
      Target: !Sub integrations/${ApiIntegration}

  # Public status page (HTML). Data integration on purpose: api_integration_broken takes it down too.
  StatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /status
      Target: !Sub integrations/${ApiIntegration}

  ChaosRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/chaos/{proxy+}
      Target: !Sub integrations/${ControlIntegration}

  AuthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/auth/{proxy+}
      Target: !Sub integrations/${ControlIntegration}

  ClassicRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/classic/{proxy+}
      Target: !Sub integrations/${ControlIntegration}

  AwsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: ANY /api/aws/{proxy+}
      Target: !Sub integrations/${ControlIntegration}

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [ApiRoute, StatusRoute, ChaosRoute, AuthRoute, ClassicRoute, AwsRoute]
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingRateLimit: !Ref ApiRateLimit
        ThrottlingBurstLimit: !Ref ApiBurstLimit
      RouteSettings:
        'ANY /api/chaos/{proxy+}': {ThrottlingRateLimit: 5, ThrottlingBurstLimit: 10}
        'ANY /api/auth/{proxy+}': {ThrottlingRateLimit: 5, ThrottlingBurstLimit: 10}
        'ANY /api/classic/{proxy+}': {ThrottlingRateLimit: 5, ThrottlingBurstLimit: 10}
        'ANY /api/aws/{proxy+}': {ThrottlingRateLimit: 2, ThrottlingBurstLimit: 4}
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogs.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","method":"$context.httpMethod","path":"$context.path","status":"$context.status","latency_ms":"$context.responseLatency","integration_latency_ms":"$context.integrationLatency","integration_error":"$context.integrationErrorMessage","error":"$context.error.message"}'
      Tags: {app: avionpulse}

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*

  # ════════════════════════════ CLASSIC TIER SUPPORT ═════════════════════
  # Nothing here costs money: roles and FIS templates only. The Classic stack
  # itself (cloudformation/classic.yaml, shipped in the code zip) is created
  # and deleted by the api function on demand.
  ClassicCfnRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CloudFormation service role for the on-demand AvionPulse Classic stack
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: cloudformation.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: classic-stack-resources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ClassicServices
                Effect: Allow
                Action: [ec2:*, elasticloadbalancing:*, autoscaling:*, rds:*]
                Resource: '*'
                Condition:
                  StringEquals: {'aws:RequestedRegion': !Ref AWS::Region}
              - Sid: PassInstanceRole
                Effect: Allow
                Action: [iam:PassRole, iam:GetInstanceProfile]
                Resource: [!GetAtt ClassicInstanceRole.Arn, !GetAtt ClassicInstanceProfile.Arn]
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName: [autoscaling.amazonaws.com, elasticloadbalancing.amazonaws.com, rds.amazonaws.com]
              - Sid: PublicAmiParameter
                Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/*
              - Sid: RdsManagedMasterSecret
                Effect: Allow
                Action: [secretsmanager:CreateSecret, secretsmanager:DeleteSecret, secretsmanager:DescribeSecret,
                         secretsmanager:PutSecretValue, secretsmanager:RotateSecret, secretsmanager:TagResource,
                         secretsmanager:UpdateSecret]
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*
              - Sid: RdsManagedSecretKey
                Effect: Allow
                Action: [kms:DescribeKey, kms:CreateGrant, kms:Decrypt, kms:GenerateDataKey]
                Resource: '*'
                Condition:
                  StringEquals: {kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'}
              - Sid: Describe
                Effect: Allow
                Action: [kms:DescribeKey, secretsmanager:GetRandomPassword]
                Resource: '*'
      Tags:
        - {Key: app, Value: avionpulse}

  ClassicInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AvionPulse Classic tier EC2 instances (gate service + Datadog Agent)
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: gate-service
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CodePackage
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${CodeBucket}/${CodeKey}
              - Sid: ChaosSwitches
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !GetAtt Table.Arn
              - Sid: DbPassword
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rds!*
              - Sid: DatadogApiKey
                Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${DatadogApiKeySsmName}
              - Sid: Decrypt
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: [!Sub 'ssm.${AWS::Region}.amazonaws.com', !Sub 'secretsmanager.${AWS::Region}.amazonaws.com']
      Tags:
        - {Key: app, Value: avionpulse}

  ClassicInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ClassicInstanceRole]

  # EventBridge Scheduler runs a one-time deleteStack at the Classic tier's expiry.
  ClassicSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AvionPulse Classic tier auto-shutdown
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref AWS::AccountId}
      Policies:
        - PolicyName: delete-classic-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:DeleteStack
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}-classic/*
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ClassicCfnRole.Arn
      Tags:
        - {Key: app, Value: avionpulse}

  FisRole:
    Type: AWS::IAM::Role
    Properties:
      Description: AWS FIS experiments against the AvionPulse Classic tier
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: fis.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref AWS::AccountId}
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSFaultInjectionSimulatorEC2Access
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSFaultInjectionSimulatorNetworkAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSFaultInjectionSimulatorRDSAccess
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSFaultInjectionSimulatorSSMAccess
      Tags:
        - {Key: app, Value: avionpulse}

  # FIS templates target by tag, so they exist (for free) before the Classic
  # stack does and pick up whatever instances / subnets / DB it has right now.
  FisCpuStress:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: AvionPulse Classic - CPU stress on gate-service instances (5 min)
      RoleArn: !GetAtt FisRole.Arn
      StopConditions: [{Source: none}]
      Targets:
        Instances:
          ResourceType: aws:ec2:instance
          ResourceTags: {'avionpulse:classic': !Ref AWS::StackName}
          Filters: [{Path: State.Name, Values: [running]}]
          SelectionMode: ALL
      Actions:
        CpuStress:
          ActionId: aws:ssm:send-command
          Parameters:
            documentArn: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWSFIS-Run-CPU-Stress
            documentParameters: '{"DurationSeconds": "300", "InstallDependencies": "True"}'
            duration: PT6M
          Targets: {Instances: Instances}
      Tags: {Name: !Sub '${AWS::StackName}-cpu-stress', app: avionpulse}

  FisNetworkLatency:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: AvionPulse Classic - 300 ms network latency on gate-service instances (5 min)
      RoleArn: !GetAtt FisRole.Arn
      StopConditions: [{Source: none}]
      Targets:
        Instances:
          ResourceType: aws:ec2:instance
          ResourceTags: {'avionpulse:classic': !Ref AWS::StackName}
          Filters: [{Path: State.Name, Values: [running]}]
          SelectionMode: ALL
      Actions:
        Latency:
          ActionId: aws:ssm:send-command
          Parameters:
            documentArn: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWSFIS-Run-Network-Latency
            documentParameters: '{"DelayMilliseconds": "300", "Interface": "ens5", "DurationSeconds": "300", "InstallDependencies": "True"}'
            duration: PT6M
          Targets: {Instances: Instances}
      Tags: {Name: !Sub '${AWS::StackName}-network-latency', app: avionpulse}

  FisTerminateInstance:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: AvionPulse Classic - terminate one gate-service instance (ASG replaces it)
      RoleArn: !GetAtt FisRole.Arn
      StopConditions: [{Source: none}]
      Targets:
        Instances:
          ResourceType: aws:ec2:instance
          ResourceTags: {'avionpulse:classic': !Ref AWS::StackName}
          Filters: [{Path: State.Name, Values: [running]}]
          SelectionMode: COUNT(1)
      Actions:
        Terminate:
          ActionId: aws:ec2:terminate-instances
          Targets: {Instances: Instances}
      Tags: {Name: !Sub '${AWS::StackName}-terminate-instance', app: avionpulse}

  FisAzOutage:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: AvionPulse Classic - AZ-a network blackout (5 min) + RDS Multi-AZ failover
      RoleArn: !GetAtt FisRole.Arn
      StopConditions: [{Source: none}]
      Targets:
        AzSubnets:
          ResourceType: aws:ec2:subnet
          ResourceTags: {'avionpulse:classic': !Ref AWS::StackName, 'avionpulse:az': a}
          SelectionMode: ALL
        Database:
          ResourceType: aws:rds:db
          ResourceTags: {'avionpulse:classic': !Ref AWS::StackName}
          SelectionMode: ALL
      Actions:
        Blackout:
          ActionId: aws:network:disrupt-connectivity
          Parameters: {duration: PT5M, scope: all}
          Targets: {Subnets: AzSubnets}
        Failover:
          ActionId: aws:rds:reboot-db-instances
          Parameters: {forceFailover: 'true'}
          Targets: {DBInstances: Database}
      Tags: {Name: !Sub '${AWS::StackName}-az-outage', app: avionpulse}

  # ════════════════════════════ DEPLOY-TIME HELPERS ══════════════════════
  SeedFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-seed
      Description: AvionPulse table seeder (custom resource)
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 120
      Role: !GetAtt AppRole.Arn
      Handler: seed.handler
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      LoggingConfig: {LogFormat: JSON, LogGroup: !Ref SeedLogGroup}
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          QUEUE_URL: !Ref EventsQueue
          DLQ_URL: !Ref EventsDLQ
          APP_ENV: !Ref AppEnv
      Tags:
        - {Key: app, Value: avionpulse}

  SeedData:
    Type: Custom::AvionPulseSeed
    Properties:
      ServiceToken: !GetAtt SeedFunction.Arn
      SeedVersion: !Ref SeedVersion
      AdminPassword: !Ref AdminPassword

  SiteDeployerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-site-deployer
      Description: Copies the SPA into the site bucket and invalidates CloudFront (custom resource)
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 300
      Role: !GetAtt SiteDeployerRole.Arn
      Handler: site_deployer.handler
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      LoggingConfig: {LogFormat: JSON, LogGroup: !Ref SiteDeployerLogGroup}
      Tags:
        - {Key: app, Value: avionpulse}

  SiteDeployment:
    Type: Custom::AvionPulseSite
    DependsOn: [SiteBucketPolicy]
    Properties:
      ServiceToken: !GetAtt SiteDeployerFunction.Arn
      Bucket: !Ref SiteBucket
      DistributionId: !Ref Distribution
      CodeKey: !Ref CodeKey
      AppEnv: !Ref AppEnv
      AppVersion: !Ref AppVersion
      DatadogSite: !Ref DatadogSite
      RumApplicationId: !Ref RumApplicationId
      RumClientToken: !Ref RumClientToken

  # Empties the recorder bucket on stack delete so CloudFormation can remove it.
  RecorderCleanup:
    Type: Custom::AvionPulseBucketCleanup
    Properties:
      ServiceToken: !GetAtt SiteDeployerFunction.Arn
      Mode: cleanup
      Bucket: !Ref RecorderBucket

  # ════════════════════════════ COST GUARD ═══════════════════════════════
  CostBudget:
    Type: AWS::Budgets::Budget
    Condition: CreateBudget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification: {NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]
        - Notification: {NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE}
          Subscribers: [{SubscriptionType: EMAIL, Address: !Ref BudgetEmail}]

Outputs:
  SiteUrl:
    Description: Open this in a browser
    Value: !Sub https://${Distribution.DomainName}
  StatusPageUrl:
    Description: Public status page (no login) — target for the HTTP check and Synthetic API test
    Value: !Sub https://${Distribution.DomainName}/status
  DistributionId:
    Value: !Ref Distribution
  BucketName:
    Value: !Ref SiteBucket
  RecorderBucketName:
    Value: !Ref RecorderBucket
  ApiEndpoint:
    Description: Direct API Gateway URL (bypasses CloudFront)
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ApiId:
    Value: !Ref HttpApi
  ApiIntegrationId:
    Value: !Ref ApiIntegration
  TableName:
    Value: !Ref Table
  QueueUrl:
    Value: !Ref EventsQueue
  DeadLetterQueueUrl:
    Value: !Ref EventsDLQ
  EventsKeyId:
    Value: !Ref EventsKey
  ApiFunctionName:
    Value: !Ref ApiFunction
  WorkerRoleName:
    Value: !Ref WorkerRole
  WorkerDataPolicyArn:
    Value: !Ref WorkerDataPolicy
  ProcessorFunctionName:
    Value: !Ref ProcessorFunction
  ClassicStackName:
    Description: Name the Chaos page uses for the on-demand Classic stack
    Value: !Sub ${AWS::StackName}-classic
  ClassicCfnRoleArn:
    Value: !GetAtt ClassicCfnRole.Arn
  CodeKey:
    Description: Code package currently deployed
    Value: !Ref CodeKey
