AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AvionPulse v3 — Classic tier (on demand). VPC, internet-facing ALB, EC2 Auto Scaling
  group running the gate-assignment service, RDS PostgreSQL. Created and deleted by the
  core stack's api function from the Chaos page (or scripts/classic-up.sh). Costs about
  $0.07/h (minimal) or $0.11/h (full, Multi-AZ) while it exists. Do not deploy by hand
  unless you also delete it by hand.

Parameters:
  CoreStack:
    Type: String
    Description: Name of the AvionPulse core stack (tags, resource names, IAM scoping).
  Size:
    Type: String
    AllowedValues: [minimal, full]
    Default: minimal
    Description: minimal = 1 instance + single-AZ RDS; full = 2 instances across 2 AZs + Multi-AZ RDS.
  SharedSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Value the ALB requires in the X-AvionPulse-Key header (generated at launch).
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  InstanceProfileArn:
    Type: String
    Description: Instance profile created by the core stack.
  TableName:
    Type: String
    Description: Core DynamoDB table (the gate service reads chaos switches from it).
  AppEnv:
    Type: String
    Default: demo
  AppVersion:
    Type: String
    Default: 3.0.0
  EnableDatadog:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'false'
  DatadogSite:
    Type: String
    Default: datadoghq.com
  DatadogApiKeySsmName:
    Type: String
    Default: /avionpulse/datadog/api-key
  LatestAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

Conditions:
  IsFull: !Equals [!Ref Size, full]

Resources:
  # ════════════════════════════ NETWORK ══════════════════════════════════
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub '${CoreStack}-classic'}
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # App subnets are public (instances get a public IP for package installs and
  # the Datadog Agent; the security group only admits the ALB). No NAT gateway.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${CoreStack}-classic-app-a'}
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
        - {Key: 'avionpulse:az', Value: a}

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${CoreStack}-classic-app-b'}
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
        - {Key: 'avionpulse:az', Value: b}

  AppSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetA, RouteTableId: !Ref PublicRouteTable}

  AppSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetB, RouteTableId: !Ref PublicRouteTable}

  # Database subnets: local routing only, and their own network ACL so
  # classic_nacl_db_block can cut the app → DB path without touching the ALB.
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  DbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - {Key: Name, Value: !Sub '${CoreStack}-classic-db-a'}
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
        - {Key: 'avionpulse:az', Value: a}

  DbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.42.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - {Key: Name, Value: !Sub '${CoreStack}-classic-db-b'}
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
        - {Key: 'avionpulse:az', Value: b}

  DbSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DbSubnetA, RouteTableId: !Ref DbRouteTable}

  DbSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DbSubnetB, RouteTableId: !Ref DbRouteTable}

  DbNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: !Sub '${CoreStack}-classic-db'}
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  DbNaclInbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DbNetworkAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: false
      CidrBlock: 0.0.0.0/0

  DbNaclOutbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DbNetworkAcl
      RuleNumber: 100
      Protocol: -1
      RuleAction: allow
      Egress: true
      CidrBlock: 0.0.0.0/0

  DbSubnetANacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DbSubnetA, NetworkAclId: !Ref DbNetworkAcl}

  DbSubnetBNacl:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties: {SubnetId: !Ref DbSubnetB, NetworkAclId: !Ref DbNetworkAcl}

  # ════════════════════════════ SECURITY GROUPS ══════════════════════════
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AvionPulse Classic ALB (HTTP from anywhere; the listener rule checks a shared secret)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0}
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AvionPulse Classic gate-service instances
      VpcId: !Ref Vpc
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  # Its own resource so classic_sg_lockdown revokes exactly this rule.
  InstanceFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref InstanceSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: AvionPulse Classic RDS (PostgreSQL from the instances)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref InstanceSecurityGroup}
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  # ════════════════════════════ DATABASE ═════════════════════════════════
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: AvionPulse Classic database subnets
      SubnetIds: [!Ref DbSubnetA, !Ref DbSubnetB]
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}

  # Major version only: RDS picks the current default minor, so the template
  # doesn't break when AWS retires an old minor version.
  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Metadata:
      cfn-lint: {config: {ignore_checks: [W3691]}}
    Properties:
      Engine: postgres
      EngineVersion: '17'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      MultiAZ: !If [IsFull, true, false]
      DBName: gates
      MasterUsername: avionpulse
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 0
      DeletionProtection: false
      EnablePerformanceInsights: false
      AutoMinorVersionUpgrade: true
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
        - {Key: app, Value: avionpulse}
        - {Key: tier, Value: classic}

  # ════════════════════════════ LOAD BALANCER ════════════════════════════
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${CoreStack}-classic'
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref AppSubnetA, !Ref AppSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '30'}
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
        - {Key: app, Value: avionpulse}
        - {Key: tier, Value: classic}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '10'}
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
        - {Key: app, Value: avionpulse}
        - {Key: tier, Value: classic}

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '403', ContentType: application/json, MessageBody: '{"detail":"forbidden"}'}

  # Only requests carrying the shared secret (i.e. from the api Lambda) reach
  # the instances. classic_alb_maintenance swaps this action for a fixed 503.
  ForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig: {HttpHeaderName: X-AvionPulse-Key, Values: [!Ref SharedSecret]}
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ════════════════════════════ COMPUTE ══════════════════════════════════
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmi
        InstanceType: t4g.micro
        IamInstanceProfile: {Arn: !Ref InstanceProfileArn}
        SecurityGroupIds: [!Ref InstanceSecurityGroup]
        MetadataOptions: {HttpTokens: required, HttpPutResponseHopLimit: 2}
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub '${CoreStack}-classic-gates'}
              - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
              - {Key: app, Value: avionpulse}
              - {Key: tier, Value: classic}
          - ResourceType: volume
            Tags:
              - {Key: 'avionpulse:classic', Value: !Ref CoreStack}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            exec > >(tee /var/log/avionpulse-userdata.log) 2>&1
            dnf install -y python3.11 python3.11-pip unzip iproute-tc
            python3.11 -m pip install --quiet "psycopg[binary]" boto3 ddtrace
            mkdir -p /opt/avionpulse /var/log/avionpulse
            chmod 755 /var/log/avionpulse
            aws s3 cp "s3://${CodeBucket}/${CodeKey}" /tmp/code.zip --region ${AWS::Region}
            unzip -o -j /tmp/code.zip 'classic_tier/gate_service.py' -d /opt/avionpulse
            curl -sSfo /opt/avionpulse/rds-ca.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
            RUNNER="/usr/bin/python3.11"
            if [ "${EnableDatadog}" = "true" ]; then
              DDKEY=$(aws ssm get-parameter --with-decryption --name "${DatadogApiKeySsmName}" --region ${AWS::Region} --query Parameter.Value --output text)
              DD_API_KEY="$DDKEY" DD_SITE="${DatadogSite}" DD_ENV="${AppEnv}" \
                bash -c "$(curl -sSL https://install.datadoghq.com/scripts/install_script_agent7.sh)"
              cat >> /etc/datadog-agent/datadog.yaml <<'DDEOF'
            logs_enabled: true
            process_config:
              process_collection:
                enabled: true
            DDEOF
              echo "tags: [app:avionpulse, tier:classic, stack:${CoreStack}]" >> /etc/datadog-agent/datadog.yaml
              mkdir -p /etc/datadog-agent/conf.d/avionpulse.d
              cat > /etc/datadog-agent/conf.d/avionpulse.d/conf.yaml <<'DDEOF'
            logs:
              - type: file
                path: /var/log/avionpulse/gates.log
                service: avionpulse-gates
                source: python
            DDEOF
              chown -R dd-agent:dd-agent /etc/datadog-agent/conf.d/avionpulse.d
              systemctl restart datadog-agent
              RUNNER="/usr/local/bin/ddtrace-run /usr/bin/python3.11"
            fi
            cat > /etc/systemd/system/avionpulse-gates.service <<UNIT
            [Unit]
            Description=AvionPulse gate-assignment service
            After=network-online.target
            [Service]
            Environment=DB_HOST=${Database.Endpoint.Address}
            Environment=DB_SECRET_ARN=${Database.MasterUserSecret.SecretArn}
            Environment=TABLE_NAME=${TableName}
            Environment=AWS_REGION=${AWS::Region}
            Environment=DD_SERVICE=avionpulse-gates
            Environment=DD_ENV=${AppEnv}
            Environment=DD_VERSION=${AppVersion}
            Environment=DD_LOGS_INJECTION=true
            Environment=DD_TAGS=app:avionpulse,tier:classic
            ExecStart=$RUNNER /opt/avionpulse/gate_service.py
            Restart=always
            RestartSec=5
            [Install]
            WantedBy=multi-user.target
            UNIT
            systemctl daemon-reload
            systemctl enable --now avionpulse-gates

  GateAsg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${CoreStack}-classic-gates'
      MinSize: !If [IsFull, '2', '1']
      MaxSize: !If [IsFull, '2', '1']
      DesiredCapacity: !If [IsFull, '2', '1']
      VPCZoneIdentifier: [!Ref AppSubnetA, !Ref AppSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      MetricsCollection:
        - Granularity: 1Minute
      Tags:
        - {Key: 'avionpulse:classic', Value: !Ref CoreStack, PropagateAtLaunch: true}
        - {Key: app, Value: avionpulse, PropagateAtLaunch: true}
        - {Key: tier, Value: classic, PropagateAtLaunch: true}

Outputs:
  AlbDns:
    Value: !GetAtt LoadBalancer.DNSName
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  InstanceSecurityGroupId:
    Value: !Ref InstanceSecurityGroup
  DbNetworkAclId:
    Value: !Ref DbNetworkAcl
  AsgName:
    Value: !Ref GateAsg
  TargetGroupArn:
    Value: !Ref TargetGroup
  ForwardRuleArn:
    Value: !Ref ForwardRule
  DbInstanceId:
    Value: !Ref Database
  DbEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  Size:
    Value: !Ref Size
  InstanceCount:
    Value: !If [IsFull, '2', '1']
